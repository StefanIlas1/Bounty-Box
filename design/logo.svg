<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="bounty-box">
  <style>text{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:64px}</style>
  <!-- gold shadow layer -->
  <g transform="translate(3 3)" fill="#e9b949">
    <text x="8" y="66">[bounty</text><text x="268" y="66">box]</text>
  </g>
  <!-- letters: ivory fill, brown outline -->
  <g fill="#f3e7e2" stroke="#7a4a2a" stroke-width="2.2" paint-order="stroke">
    <text x="8" y="66">[bounty</text><text x="268" y="66">box]</text>
  </g>
  <!-- keyhole replaces the hyphen -->
  <g transform="translate(236 30)" fill="#e9b949" stroke="#7a4a2a" stroke-width="2.4" stroke-linejoin="round">
    <circle cx="12" cy="10" r="8"/><path d="M7.5 15h9l2.6 17H4.9Z"/>
  </g>
</svg>
